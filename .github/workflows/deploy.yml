name: Deploy to Server via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Run Storage Link
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment webhook to complete
        run: |
          echo "Waiting for deployment webhook to finish..."
          sleep 30
          echo "Proceeding with storage:link..."

      - name: Run php artisan storage:link via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd domains/ihyamars.my.id/public_html/
            php artisan storage:link
