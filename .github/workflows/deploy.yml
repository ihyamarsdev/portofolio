name: Deploy to Server via FTP

on:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run code formatting check
        run: vendor/bin/pint --format agent

      - name: Run test suite
        run: php artisan test --compact

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Run Storage Link
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Wait for deployment webhook to complete
        run: |
          echo "Waiting for deployment webhook to finish..."
          sleep 15
          echo "Proceeding with storage:link..."

      - name: Run php artisan storage:link via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          debug: true
          command_timeout: 30m
          script: |
            set -e
            echo "=== Starting SSH Session ==="
            echo "Current directory: $(pwd)"
            echo "Changing to project directory..."
            cd domains/ihyamars.my.id/public_html/ || { echo "Failed to change directory"; exit 1; }
            echo "Current directory: $(pwd)"
            echo "Running storage:link..."
            php artisan storage:link || { echo "storage:link failed"; exit 1; }
            echo "=== Completed Successfully ==="
