services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: portofolio-app
        container_name: portofolio-app
        restart: unless-stopped
        ports:
            - "8000:8000"
            - "5173:5173"
        env_file:
            - .env
        volumes:
            - ./:/app
        command: --watch
        depends_on:
            - db
        networks:
            - app-network

    db:
        image: postgres:16-alpine
        container_name: portofolio-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-portofolio}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
