services:
  portofolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portofolio-app
    container_name: portofolio-app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - storage:/app/storage
    labels:
      - "traefik.enable=true"
      # HTTP → redirect permanent ke HTTPS
      - "traefik.http.routers.portofolio.entrypoints=web"
      - "traefik.http.routers.portofolio.rule=Host(`ihyamars.my.id`)"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.portofolio.middlewares=https-redirect"
      # HTTPS router
      - "traefik.http.routers.portofolio-secure.entrypoints=websecure"
      - "traefik.http.routers.portofolio-secure.rule=Host(`ihyamars.my.id`)"
      - "traefik.http.routers.portofolio-secure.tls=true"
      - "traefik.http.routers.portofolio-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portofolio-secure.service=portofolio"
      - "traefik.http.routers.portofolio-secure.middlewares=ssl-header"
      # Forward header agar Laravel tahu request datang via HTTPS
      - "traefik.http.middlewares.ssl-header.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Backend port FrankenPHP
      - "traefik.http.services.portofolio.loadbalancer.server.port=8888"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8888/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: portofolio-db
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: portofolio-redis
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragondata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  dragondata:
  storage:

networks:
  backend:
    external: true
