services:
  portofolio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: portofolio-app
    container_name: portofolio-app
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://ihyamars.my.id}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
      WAIT_FOR_REDIS: ${WAIT_FOR_REDIS:-true}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      REDIS_WAIT_TIMEOUT: ${REDIS_WAIT_TIMEOUT:-60}
    networks:
      - backend
    volumes:
      - storage:/app/storage
    ports:
      - "100.104.67.88:8888:8888"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: 768m
    cpus: 1.50
    labels:
      - "traefik.enable=true"
      # HTTP → redirect permanent ke HTTPS
      - "traefik.http.routers.portofolio.entrypoints=web"
      - "traefik.http.routers.portofolio.rule=Host(`ihyamars.my.id`)"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.portofolio.middlewares=https-redirect"
      # HTTPS router
      - "traefik.http.routers.portofolio-secure.entrypoints=websecure"
      - "traefik.http.routers.portofolio-secure.rule=Host(`ihyamars.my.id`)"
      - "traefik.http.routers.portofolio-secure.tls=true"
      - "traefik.http.routers.portofolio-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portofolio-secure.service=portofolio"
      - "traefik.http.routers.portofolio-secure.middlewares=ssl-header"
      # Forward header agar Laravel tahu request datang via HTTPS
      - "traefik.http.middlewares.ssl-header.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Backend port FrankenPHP
      - "traefik.http.services.portofolio.loadbalancer.server.port=8888"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8888/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: portofolio-db
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - backend
    environment:
      POSTGRES_DB: ${DB_DATABASE:-portofolio}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: portofolio-redis
    command: ["--cache_mode=true"]
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragondata:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  dragondata:
  storage:

networks:
  backend:
    external: true
